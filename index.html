<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리본 에너지 스마트 대시보드</title>
    <!-- 그래프를 그리기 위한 Chart.js 도구 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; padding: 20px; background-color: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: 10px auto; }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        .data-text { font-size: 22px; font-weight: bold; color: #27ae60; line-height: 1.5; }
        .advice-box { background: #ffeaa7; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; color: #d35400; margin-top: 15px; }
        button { background: #3498db; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px;}
    /* ==========================================
           슬라이드(스와이프) 기능을 위한 CSS 추가
           ========================================== */
        body { 
            margin: 0; /* 기본 여백 없애기 */
            padding: 0; 
            overflow-x: hidden; /* 전체 화면의 가로 스크롤 숨기기 */
        }
        
        .slider-container {
            display: flex; /* 페이지들을 가로로 한 줄로 배치 */
            overflow-x: auto; /* 가로 스크롤 허용 */
            scroll-snap-type: x mandatory; /* 넘길 때 화면에 딱 맞게 걸리도록 설정 */
            width: 100vw; /* 스마트폰 가로 너비 100% */
            height: 100vh; /* 스마트폰 세로 높이 100% */
            scroll-behavior: smooth; /* 부드럽게 넘어가기 */
        }

        .slider-container::-webkit-scrollbar {
            display: none; /* 지저분한 스크롤바 숨기기 (앱처럼 보이게) */
        }

        .page {
            flex: 0 0 100vw; /* 각 페이지가 화면 너비 100%를 차지하게 함 */
            scroll-snap-align: start; /* 페이지 시작점에 딱 걸리게 함 */
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- 전체 슬라이드 도화지 -->
    <div class="slider-container">

        <!-- 📱 첫 번째 페이지 (왼쪽 화면) : 실내 환경 -->
        <div class="page">
            <div class="card">
                <h2>🌱 실내 환경 (블루투스)</h2>
                <button id="connectBtn">블루투스 기기 연결하기</button>
                <div id="tempHumData" class="data-text">연결 대기 중...</div>
                <div id="statusText" style="font-size: 12px; color: gray;">기기명: Nano33_Weather</div>
                
                <div id="adviceBox" class="advice-box">날씨와 실내 온도를 분석 중입니다...</div>
            </div>
            
            <p style="color: gray; font-size: 14px; margin-top: 20px;">
                👉 옆으로 스와이프해서 날씨/그래프 보기
            </p>
        </div>

        <!-- 📱 두 번째 페이지 (오른쪽 화면) : 날씨와 그래프 -->
        <div class="page">
            <div class="card">
                <h2>🌤️ 외부 날씨 (양천구)</h2>
                <div id="weatherData" class="data-text">날씨 불러오는 중...</div>
            </div>

            <div class="card">
                <h2>📈 실시간 변화 그래프</h2>
                <canvas id="myChart"></canvas>
            </div>
            
            <p style="color: gray; font-size: 14px; margin-top: 20px;">
                👈 옆으로 스와이프해서 메인으로
            </p>
        </div>

    </div> <!-- 슬라이드 도화지 끝 -->

    <script>
        /* ==========================================
           1. 외부 날씨 가져오기 (OpenWeatherMap API)
           ========================================== */
        // ⭐ OpenWeatherMap API Key
        const API_KEY = "8f473ed478c67abe7a3dec096bbe4153"; 
        let outTemp = 0; // 외부 온도
        let outAqi = 0;  // 외부 공기질 지수 (조언 알고리즘용)

        async function getWeather() {
            try {
                const lat = 37.5170; // 양천구 위도
                const lon = 126.8666; // 양천구 경도

                // 1. 기존 날씨 데이터 가져오기
                const weatherRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=kr`);
                const weatherData = await weatherRes.json();
                
                outTemp = weatherData.main.temp;
                const outHumi = weatherData.main.humidity;
                const weatherDesc = weatherData.weather[0].description;
                
                // 2. 🌟 공기질(Air Pollution) 데이터 추가로 가져오기!
                const airRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
                const airData = await airRes.json();
                
                // 공기질 지수(1~5)와 미세먼지 수치 뽑아내기
                outAqi = airData.list[0].main.aqi; 
                const pm10 = airData.list[0].components.pm10;
                const pm25 = airData.list[0].components.pm2_5;
                
                // 숫자로 된 AQI(1~5)를 알기 쉬운 한글로 변환
                let aqiText = "";
                if(outAqi === 1) aqiText = "🟢 좋음";
                else if(outAqi === 2) aqiText = "🟡 보통";
                else if(outAqi === 3) aqiText = "🟠 민감군 나쁨";
                else if(outAqi === 4) aqiText = "🔴 나쁨";
                else if(outAqi === 5) aqiText = "⚫ 매우 나쁨";

                // 3. 화면에 날씨 + 공기질 한 번에 띄우기
                document.getElementById('weatherData').innerHTML = 
                    `온도: ${outTemp} °C (습도: ${outHumi}%) <br> 
                     상태: ${weatherDesc} <br>
                     <hr style="border: 0.5px solid #ddd; margin: 10px 0;">
                     대기질: ${aqiText} <br>
                     미세먼지: ${pm10} ㎍/㎥ <br>
                     초미세먼지: ${pm25} ㎍/㎥`;
                
            } catch (error) {
                document.getElementById('weatherData').innerHTML = "정보를 불러오지 못했습니다.";
                console.log(error);
            }
        }
        getWeather(); // 웹사이트 열리자마자 날씨 한 번 가져오기


        /* ==========================================
           2. 조언(Advice) 생성 알고리즘
           ========================================== */
        function generateAdvice(inTemp, outTemp) {
            const adviceBox = document.getElementById('adviceBox');
            
            // 규칙 1: 실내가 26도 이상인데, 밖이 더 시원할 때
            if (inTemp >= 26 && inTemp > outTemp) {
                adviceBox.innerText = "💡 바깥이 더 시원합니다! 에어컨을 끄고 환기하여 에너지를 절약하세요.";
            } 
            // 규칙 2: 실내외 모두 너무 더울 때
            else if (inTemp >= 26 && outTemp >= 28) {
                adviceBox.innerText = "💡 냉방이 필요합니다. 에어컨 희망 온도를 26도로 설정하세요.";
            }
            // 규칙 3: 실내가 너무 추울 때 (에너지 낭비)
            else if (inTemp <= 23) {
                adviceBox.innerText = "💡 실내가 춥습니다! 에어컨을 끄거나 온도를 높여주세요.";
            } 
            // 기본 상태
            else {
                adviceBox.innerText = "👍 아주 쾌적하고 에너지 효율적인 환경입니다!";
            }
        }


        /* ==========================================
           3. 그래프 그리기 세팅 (Chart.js)
           ========================================== */
        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // 시간 데이터가 들어갈 곳 (X축)
                datasets: [
                    { label: '온도(°C)', borderColor: '#e74c3c', data: [] },
                    { label: '습도(%)', borderColor: '#3498db', data: [] }
                ]
            },
            options: { animation: false } // 실시간 데이터라 애니메이션을 끄면 깔끔함
        });


        /* ==========================================
           4. 블루투스 연결 및 데이터 수신 (기존과 동일)
           ========================================== */
        const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
        const TEMP_CHAR_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
        const HUMI_CHAR_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";

        let currentTemp = "--";
        let currentHumi = "--";

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Nano33_Weather' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);

                // 온도 통로 연결
                const tempChar = await service.getCharacteristic(TEMP_CHAR_UUID);
                await tempChar.startNotifications();
                tempChar.addEventListener('characteristicvaluechanged', (e) => {
                    currentTemp = e.target.value.getFloat32(0, true).toFixed(1);
                    updateDashboard();
                });

                // 습도 통로 연결
                const humiChar = await service.getCharacteristic(HUMI_CHAR_UUID);
                await humiChar.startNotifications();
                humiChar.addEventListener('characteristicvaluechanged', (e) => {
                    currentHumi = e.target.value.getFloat32(0, true).toFixed(1);
                    updateDashboard();
                });

                document.getElementById('connectBtn').style.display = 'none';

            } catch (error) {
                alert("블루투스 연결 실패!");
            }
        });

        // 온도나 습도가 들어올 때마다 화면, 그래프, 조언을 업데이트하는 함수
        function updateDashboard() {
            // 1. 글자 업데이트
            document.getElementById('tempHumData').innerHTML = `온도: ${currentTemp} °C <br> 습도: ${currentHumi} %`;
            
            // 2. 조언 생성기 실행
            if (currentTemp !== "--" && outTemp !== 0) {
                generateAdvice(parseFloat(currentTemp), outTemp);
            }

            // 3. 그래프 선 그리기 (현재 시간 기록)
            const now = new Date();
            const timeString = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;
            
            myChart.data.labels.push(timeString);
            myChart.data.datasets[0].data.push(currentTemp);
            myChart.data.datasets[1].data.push(currentHumi);
            
            // 그래프가 너무 길어지면 앞부분 자르기 (최근 20개만 유지)
            if(myChart.data.labels.length > 20) {
                myChart.data.labels.shift();
                myChart.data.datasets[0].data.shift();
                myChart.data.datasets[1].data.shift();
            }
            myChart.update();
        }
    </script>
</body>
</html>
