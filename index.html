<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리본 BEMS 대시보드</title>
    <!-- 그래프 도구 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ==========================================
           1. 전체 배경 & 스와이프 설정 (앱 느낌)
           ========================================== */
        body { 
            margin: 0; padding: 0; 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); /* 맑고 시원한 배경화면 느낌 */
            overflow: hidden; /* 스크롤바 숨기기 */
            color: #333;
        }
        
        .slider-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            width: 100vw;
            height: 100vh;
            scroll-behavior: smooth;
        }
        .slider-container::-webkit-scrollbar { display: none; } /* 화면 아래 지저분한 스크롤바 제거 */

        .page {
            flex: 0 0 100vw;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ==========================================
           2. 디자인 요소 (유리 질감 카드, 글씨 등)
           ========================================== */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px); /* 뒤 배경이 살짝 비치는 유리 효과 */
            border-radius: 25px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }

        /* 큰 숫자 패널 */
        .data-panel { display: flex; justify-content: space-around; margin: 30px 0; }
        .data-box { display: flex; flex-direction: column; align-items: center; }
        .data-label { font-size: 16px; color: #555; font-weight: bold; margin-bottom: 5px; }
        .data-value { font-size: 55px; font-weight: 900; color: #2c3e50; }
        .data-unit { font-size: 20px; color: #7f8c8d; }

        /* 조언 박스 */
        .advice-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
            line-height: 1.5;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* 버튼 및 기타 글씨 */
        button { background: #3498db; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);}
        .small-weather { font-size: 14px; color: #555; margin-top: 10px; }
        .swipe-hint { font-size: 14px; color: #666; font-weight: bold; margin-top: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

        /* 그래프 박스 */
        .chart-wrapper { height: 32vh; width: 100%; margin-bottom: 15px; }
        .graph-title { font-size: 16px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; text-align: left; padding-left: 10px;}
    </style>
</head>
<body>

    <div class="slider-container">

        <!-- 📱 [1페이지] 메인 화면 : 핵심 데이터 및 피드백 -->
        <div class="page">
            <div class="glass-card">
                <h2 style="margin: 0 0 10px 0; color: #2c3e50;">🌱 BEMS 대시보드</h2>
                
                <button id="connectBtn">블루투스 기기 연결하기</button>

                <!-- 거대한 온습도 패널 -->
                <div class="data-panel">
                    <div class="data-box">
                        <span class="data-label">실내 온도</span>
                        <div><span id="tempVal" class="data-value">--</span><span class="data-unit">°C</span></div>
                    </div>
                    <div class="data-box">
                        <span class="data-label">실내 습도</span>
                        <div><span id="humiVal" class="data-value">--</span><span class="data-unit">%</span></div>
                    </div>
                </div>

                <!-- AI 조언 피드백 박스 -->
                <div id="adviceBox" class="advice-box">기기를 연결하면 조언이 표시됩니다.</div>
                
                <!-- 외부 날씨 요약 (작게) -->
                <div id="weatherData" class="small-weather">외부 날씨 불러오는 중...</div>

                <div class="swipe-hint">상세 그래프 보기 👉</div>
            </div>
        </div>

        <!-- 📱 [2페이지] 그래프 화면 : 온습도 분리 상세 그래프 -->
        <div class="page">
            <div class="glass-card" style="max-width: 500px; height: 90vh; display: flex; flex-direction: column; justify-content: center;">
                <h2 style="margin: 0 0 15px 0; color: #2c3e50;">📈 실시간 상세 변화</h2>
                
                <!-- 1번 그래프: 온도 전용 -->
                <div class="graph-title">🌡️ 실내 온도 변화</div>
                <div class="chart-wrapper">
                    <canvas id="tempChart"></canvas>
                </div>

                <!-- 2번 그래프: 습도 전용 -->
                <div class="graph-title">💧 실내 습도 변화</div>
                <div class="chart-wrapper">
                    <canvas id="humiChart"></canvas>
                </div>

                <div class="swipe-hint">👈 메인 화면으로</div>
            </div>
        </div>

    </div>

    <script>
        // ⭐ Ngrok 주소
        const NGROK_URL = "https://humbly-snowstorm-energize.ngrok-free.dev";
        /* ==========================================
           1. API 및 기본 세팅
           ========================================== */
        // ⭐ OpenWeatherMap API 키
        const API_KEY = "8f473ed478c67abe7a3dec096bbe4153"; 
        
        // 등촌1종합사회복지관 좌표 (다른 곳이면 수정)
        const lat = 37.5593; 
        const lon = 126.8427; 

        let outTemp = 0; 
        let outAqi = 0;  

        /* ==========================================
           2. 날씨 및 공기질 가져오기
           ========================================== */
        async function getWeather() {
            try {
                // 날씨
                const wRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=kr`);
                const wData = await wRes.json();
                outTemp = wData.main.temp;
                const weatherDesc = wData.weather[0].description;
                
                // 공기질
                const aRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
                const aData = await aRes.json();
                outAqi = aData.list[0].main.aqi; 
                let aqiText = ["", "🟢 좋음", "🟡 보통", "🟠 나쁨(민감)", "🔴 나쁨", "⚫ 매우 나쁨"][outAqi] || "알 수 없음";

                document.getElementById('weatherData').innerHTML = `📍등촌동 외부: ${outTemp}°C | ${weatherDesc} | 대기질: ${aqiText}`;
            } catch (e) {
                document.getElementById('weatherData').innerHTML = "날씨 정보를 불러오지 못했습니다.";
            }
        }
        getWeather();

        /* ==========================================
           3. 조언(Advice) 알고리즘
           ========================================== */
        function generateAdvice(inTemp) {
            const adviceBox = document.getElementById('adviceBox');
            
            // 미세먼지가 나쁠 때 (AQI 4 이상)
            if (outAqi >= 4) {
                adviceBox.innerHTML = "🚨 외부 미세먼지가 나쁩니다.<br>창문을 닫고 공기청정기를 가동하세요!";
            }
            // 실내가 덥고, 밖이 시원하며, 미세먼지가 좋을 때
            else if (inTemp >= 26 && inTemp > outTemp && outAqi <= 2) {
                adviceBox.innerHTML = "💡 바깥 공기가 더 시원하고 깨끗합니다.<br>에어컨을 끄고 환기하세요!";
            }
            // 실내외 모두 더울 때
            else if (inTemp >= 26 && outTemp >= 26) {
                adviceBox.innerHTML = "💡 실내외 모두 덥습니다.<br>에어컨 희망온도를 26°C로 설정하세요.";
            }
            else if (inTemp <= 22) {
                adviceBox.innerHTML = "💡 실내가 춥습니다. 에너지가 낭비되고 있습니다!<br>냉방을 멈춰주세요.";
            }
            else {
                adviceBox.innerHTML = "👍 아주 쾌적하고 에너지 효율적인 환경입니다!";
            }
        }

        /* ==========================================
           4. 온습도 분리 그래프 세팅 (Chart.js)
           ========================================== */
        // 온도 그래프 설정
        const ctxTemp = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(ctxTemp, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '온도 (°C)', borderColor: '#ff6b6b', backgroundColor: 'rgba(255, 107, 107, 0.2)', fill: true, data: [], tension: 0.4 }] },
            options: { maintainAspectRatio: false, animation: false, scales: { y: { suggestedMin: 20, suggestedMax: 30 } } }
        });

        // 습도 그래프 설정
        const ctxHumi = document.getElementById('humiChart').getContext('2d');
        const humiChart = new Chart(ctxHumi, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '습도 (%)', borderColor: '#48dbfb', backgroundColor: 'rgba(72, 219, 251, 0.2)', fill: true, data: [], tension: 0.4 }] },
            options: { maintainAspectRatio: false, animation: false, scales: { y: { suggestedMin: 30, suggestedMax: 70 } } }
        });


        // 📡 [관리자용] 블루투스 데이터를 서버로 전송 (POST)
async function sendDataToServer(temp, humi) {
    try {
        await fetch(NGROK_URL + "/api/data", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ temp: temp, humi: humi })
        });
        console.log("서버 전송 성공!");
    } catch (error) {
        console.error("서버 전송 실패:", error);
    }
}
        
        /* ==========================================
           5. 블루투스 연결 (기존 유지)
           ========================================== */
        const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
        const TEMP_CHAR_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
        const HUMI_CHAR_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";

        let currentTemp = "--"; let currentHumi = "--";

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Nano33_Weather' }], optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);

                // 온도 받기
                const tChar = await service.getCharacteristic(TEMP_CHAR_UUID);
                await tChar.startNotifications();
                tChar.addEventListener('characteristicvaluechanged', (e) => {
                    currentTemp = e.target.value.getFloat32(0, true).toFixed(1);
                    updateDashboard();
                });

                // 습도 받기
                const hChar = await service.getCharacteristic(HUMI_CHAR_UUID);
                await hChar.startNotifications();
                hChar.addEventListener('characteristicvaluechanged', (e) => {
                    currentHumi = e.target.value.getFloat32(0, true).toFixed(1);
                    updateDashboard();
                });

                document.getElementById('connectBtn').style.display = 'none';
            } catch (error) { alert("블루투스 연결 실패!"); }
        });

        // 화면 및 2개의 그래프 업데이트 함수
        function updateDashboard() {
           // 10분 측정을 위한 타이머 변수
        let lastRecordedTime = 0; 
        const TEN_MINUTES_MS = 10 * 60 * 1000; // 10분을 밀리초로 변환 (600,000ms)

        // 블루투스로 데이터가 들어올 때마다 화면의 '큰 숫자'는 계속 바뀝니다.
        // 하지만 '그래프'와 '서버 전송'은 10분에 한 번만 실행됩니다!
        function updateDashboard() {
            // 1. 화면의 큰 숫자 업데이트 (이건 실시간으로 바로바로 바뀜)
            document.getElementById('tempVal').innerText = currentTemp;
            document.getElementById('humiVal').innerText = currentHumi;
            
            // 조언 실행
            if (currentTemp !== "--" && outTemp !== 0) {
                generateAdvice(parseFloat(currentTemp));
            }

            // 2. ⭐ 10분에 한 번씩만 그래프에 점을 찍고 서버로 전송!
            const nowTime = Date.now();
            
            // 프로그램이 처음 켜졌거나, 마지막 기록 후 10분이 지났다면 실행
            if (lastRecordedTime === 0 || (nowTime - lastRecordedTime) >= TEN_MINUTES_MS) {
                lastRecordedTime = nowTime; // 마지막 기록 시간 업데이트
                
                const now = new Date();
                const timeStr = `${now.getHours()}시 ${now.getMinutes()}분`; // 14:20 형태로 표시
                
                // 서버로 데이터 쏘기
                sendDataToServer(currentTemp, currentHumi);

                // 온도 그래프 그리기
                tempChart.data.labels.push(timeStr);
                tempChart.data.datasets[0].data.push(currentTemp);
                // 144개(24시간)가 넘어가면 가장 오래된 데이터를 지워서 밀어내기
                if(tempChart.data.labels.length > 144) { 
                    tempChart.data.labels.shift(); 
                    tempChart.data.datasets[0].data.shift(); 
                }
                tempChart.update();

                // 습도 그래프 그리기
                humiChart.data.labels.push(timeStr);
                humiChart.data.datasets[0].data.push(currentHumi);
                if(humiChart.data.labels.length > 144) { 
                    humiChart.data.labels.shift(); 
                    humiChart.data.datasets[0].data.shift(); 
                }
                humiChart.update();
            }
        }
            
            // 화면 업데이트 시 전송 함수 실행하기
            if (currentTemp !== "--" && currentHumi !== "--") {
        sendDataToServer(currentTemp, currentHumi);
    }
            
            // 📱 [일반 사용자용] 서버에서 최신 데이터 가져오기 (GET)
async function fetchLatestData() {
    try {
        const response = await fetch(NGROK_URL + "/api/latest_data");
        const data = await response.json();
        
        if (data.status === "success") {
            currentTemp = data.temp;
            currentHumi = data.humi;
            
            // 블루투스 연결 없이도 화면 업데이트!
            updateDashboard(); 
            document.getElementById('statusText').innerText = "🌐 원격 서버와 연결됨";
        }
    } catch (error) {
        console.error("데이터 불러오기 실패:", error);
    }
}

// 💡 팁: 일반 사용자는 웹에 들어오자마자 데이터를 봐야 하니 5초마다 계속 서버를 확인하도록 설정
// setInterval(fetchLatestData, 5000); // <-- 이 줄의 주석(//)을 풀면 즉시 원격 모드로 작동
        }
    </script>
</body>
</html>
