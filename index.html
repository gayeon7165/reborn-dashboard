<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리본 에너지 대시보드</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; padding: 50px; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        .data-text { font-size: 24px; font-weight: bold; color: #27ae60; margin: 20px 0; }
        button { background: #3498db; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌱 현재 실내 환경</h1>
        <button id="connectBtn">기기 연결하기</button>
        <div id="tempHumData" class="data-text">연결 대기 중...</div>
    </div>

    <script>
        // 아두이노 코드에 적었던 UUID와 동일해야 합니다.
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                // 1. 기기 검색 창 띄우기 (해당 UUID를 가진 기기만 필터링)
                console.log('블루투스 기기 검색 중...');
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Reborn_ESP32' }],
                    optionalServices: [SERVICE_UUID]
                });

                // 2. 기기 연결 및 서비스 접근
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // 3. 데이터가 바뀔 때마다 알림(Notify) 받기 시작
                await characteristic.startNotifications();
                document.getElementById('connectBtn').style.display = 'none'; // 연결되면 버튼 숨기기
                
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    // 아두이노에서 보낸 문자열 데이터 해독하기
                    const value = new TextDecoder().decode(event.target.value);
                    console.log("수신된 데이터: ", value);
                    
                    // "26.5,50.2"를 쉼표 기준으로 쪼개서 화면에 예쁘게 띄우기
                    const dataArray = value.split(',');
                    if(dataArray.length === 2) {
                        const temp = dataArray[0];
                        const hum = dataArray[1];
                        document.getElementById('tempHumData').innerHTML = 
                            `온도: ${temp}°C <br> 습도: ${hum}%`;
                    }
                });
            } catch (error) {
                console.log('연결 실패: ', error);
                alert("블루투스 연결에 실패했습니다. 다시 시도해주세요.");
            }
        });
    </script>
</body>
</html>
