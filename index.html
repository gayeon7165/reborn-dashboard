<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리본 에너지 대시보드</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; padding: 50px; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        .data-text { font-size: 28px; font-weight: bold; color: #27ae60; margin: 20px 0; line-height: 1.5; }
        button { background: #3498db; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-bottom: 20px;}
        button:hover { background: #2980b9; }
        .status { font-size: 14px; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌱 실내 환경 모니터링</h1>
        <button id="connectBtn">블루투스 연결하기</button>
        <div id="tempHumData" class="data-text">연결 대기 중...</div>
        <div id="statusText" class="status">아두이노 기기(Nano33_Weather) 전원을 켜주세요.</div>
    </div>

    <script>
        // 팀원분이 아두이노 코드에 설정한 UUID (절대 수정 금지)
        const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
        const TEMP_CHAR_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
        const HUMI_CHAR_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";

        let currentTemp = "--";
        let currentHumi = "--";

        // 화면 업데이트 함수
        function updateUI() {
            document.getElementById('tempHumData').innerHTML = `온도: ${currentTemp} °C <br> 습도: ${currentHumi} %`;
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('statusText').innerText = "기기 검색 중...";

                // 1. 기기 검색 창 띄우기 (Nano33_Weather 이름 찾기)
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Nano33_Weather' }],
                    optionalServices: [SERVICE_UUID]
                });

                document.getElementById('statusText').innerText = "기기 연결 중...";

                // 2. 기기 연결 및 서비스 접근
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);

                // 3. 온도 데이터(Float) 받기 설정
                const tempChar = await service.getCharacteristic(TEMP_CHAR_UUID);
                await tempChar.startNotifications();
                tempChar.addEventListener('characteristicvaluechanged', (event) => {
                    // 아두이노에서 보낸 Float(소수점 숫자) 읽기 (Little Endian 방식)
                    let value = event.target.value.getFloat32(0, true);
                    currentTemp = value.toFixed(1); // 소수점 첫째 자리까지만 표시
                    updateUI();
                });

                // 4. 습도 데이터(Float) 받기 설정
                const humiChar = await service.getCharacteristic(HUMI_CHAR_UUID);
                await humiChar.startNotifications();
                humiChar.addEventListener('characteristicvaluechanged', (event) => {
                    let value = event.target.value.getFloat32(0, true);
                    currentHumi = value.toFixed(1);
                    updateUI();
                });

                // 연결 성공 시 UI 변경
                document.getElementById('connectBtn').style.display = 'none'; 
                document.getElementById('statusText').innerText = "✅ 연결됨 (2초마다 자동 갱신)";

            } catch (error) {
                console.log('연결 실패: ', error);
                document.getElementById('statusText').innerText = "연결 실패. 크롬 브라우저인지, 기기가 켜져있는지 확인하세요.";
                alert("블루투스 연결에 실패했습니다.");
            }
        });
    </script>
</body>
</html>
